version: '3.8'

services:
  foodscholar:
    build: .
    container_name: foodscholar
    ports:
      - "8080:8080"
    environment:
      - GROQ_API_KEY=_your_api_key_here_
      - OPENAI_API_KEY=_your_openai_api_key_here_
      - PORT=8080
      # Model roles all have defaults (see README > Configuration > Models),
      # so nothing needs setting here. Override a role to pin it, e.g.:
      # - QA_DEFAULT_MODEL=openai/gpt-oss-20b
      # - QA_AVAILABLE_MODELS=openai/gpt-oss-20b,qwen/qwen3.6-27b
    volumes:
      - ./app.py:/app/app.py
      # The LinearRAG index, mounted rather than baked in.
      #
      # 617MB of runtime data that used to be the entire build context and a
      # layer in the image. `linearrag_service` reads
      # `src/data/<dataset_name>`, so this is where it has to land. Read-only:
      # the retriever loads it and never writes.
      #
      # Without this mount the `linearrag` retriever fails on a missing file;
      # `rag` and `no_rag` are unaffected.
      - ./src/data:/app/src/data:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
