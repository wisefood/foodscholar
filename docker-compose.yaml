version: '3.8'

services:
  foodscholar:
    build: .
    container_name: foodscholar
    ports:
      - "8080:8080"
    environment:
      - GROQ_API_KEY=_your_api_key_here_
      - OPENAI_API_KEY=_your_openai_api_key_here_
      - PORT=8080
      # Model roles all have defaults (see README > Configuration > Models),
      # so nothing needs setting here. Override a role to pin it, e.g.:
      # - QA_DEFAULT_MODEL=openai/gpt-oss-20b
      # - QA_AVAILABLE_MODELS=openai/gpt-oss-20b,qwen/qwen3.6-27b
      #
      # The `kggen` retriever needs the knowledge graph. It reads the same
      # stores the offline build writes, so it needs their addresses and not
      # a mounted index:
      # - KG_ENABLED=true
      # - KG_ES_URL=http://elastic:9200
      # - KG_NEO4J_URL=bolt://neo4j:7687
      # - KG_NEO4J_AUTH=neo4j/your_password
    volumes:
      - ./app.py:/app/app.py
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
