name: Build foodscholar image (fix/graph-slashed-ids)

# Lives on this branch only: it publishes the graph fix without merging it into
# main. Delete it before the branch is merged — main's own workflow takes over.

on:
  push:
    branches: [fix/graph-slashed-ids]

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/foodscholar:sha-${{ github.sha }}
            ${{ vars.DOCKERHUB_USERNAME }}/foodscholar:latest
